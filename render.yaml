services:
  - type: web
    name: valdiron-tracker-api
    runtime: node
    plan: free
    region: virginia
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: APP_ORIGIN
        value: "*"
